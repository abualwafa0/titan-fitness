<div class="dialog-header">
  <h2 class="dialog-title">Filter Trainers</h2>
  <button type="button" class="icon-btn" aria-label="Close" (click)="cancel()">
    <app-icon name="close" [size]="18" />
  </button>
</div>

<div class="dialog-body">
  <section class="group">
    <span class="label" id="branchLabel">Branch</span>

    <div class="dropdown" appClickOutside (clickOutside)="branchOpen.set(false)">
      <button type="button" class="input dropdown-trigger" aria-haspopup="listbox"
        aria-labelledby="branchLabel" [attr.aria-expanded]="branchOpen()"
        (click)="branchOpen.set(!branchOpen())">
        <span [class.placeholder]="selectedBranchIds().length === 0">{{ branchSummary() }}</span>
        <app-icon name="chevron-down" [size]="16" />
      </button>

      @if (branchOpen()) {
        <div class="dropdown-panel" role="listbox" aria-multiselectable="true">
          @for (branch of branches(); track branch.branchId) {
            <label class="checkbox-row">
              <input type="checkbox"
                [checked]="selectedBranchIds().includes(branch.branchId)"
                (change)="toggleBranch(branch.branchId)" />
              <span>{{ branch.branchName }}</span>
            </label>
          }
        </div>
      }
    </div>
  </section>

  <section class="group">
    <label class="label" for="specialtySearch">Specialty</label>

    @if (selectedSpecialties().length > 0) {
      <div class="chips">
        @for (item of selectedSpecialties(); track item) {
          <button type="button" class="chip selected" (click)="toggleSpecialty(item)"
            [attr.aria-label]="'Remove ' + item">
            {{ item }}
            <app-icon name="close" [size]="12" />
          </button>
        }
      </div>
    }

    <input id="specialtySearch" type="text" class="input" placeholder="Type to search specialties..."
      autocomplete="off" [value]="specialtyText()" (input)="onSpecialtyInput($event)" />

    <div class="check-list scroll">
      @for (option of visibleSpecialties(); track option) {
        <label class="checkbox-row">
          <input type="checkbox"
            [checked]="selectedSpecialties().includes(option)"
            (change)="toggleSpecialty(option)" />
          <span>{{ option }}</span>
        </label>
      } @empty {
        <span class="muted small">No specialties found.</span>
      }
    </div>
  </section>

  <section class="group">
    <span class="label">Status</span>
    <div class="check-list inline">
      <label class="checkbox-row">
        <input type="checkbox" [checked]="activeChecked()"
          (change)="activeChecked.set(!activeChecked())" />
        <span>Active</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" [checked]="inactiveChecked()"
          (change)="inactiveChecked.set(!inactiveChecked())" />
        <span>Inactive</span>
      </label>
    </div>
  </section>
</div>

<div class="dialog-footer">
  <button type="button" class="btn btn-outline" (click)="clear()">Clear</button>
  <span class="spacer"></span>
  <button type="button" class="btn btn-outline" (click)="cancel()">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="apply()">Apply</button>
</div>
