<div class="dialog-header">
  <h2 class="dialog-title">Filter Plans</h2>
  <button type="button" class="icon-btn" aria-label="Close" (click)="cancel()">
    <app-icon name="close" [size]="18" />
  </button>
</div>

<div class="dialog-body">
  <section class="group">
    <span class="label">Duration</span>
    <div class="chips">
      @for (months of durationOptions(); track months) {
        <button type="button" class="chip" [class.selected]="selectedDurations().includes(months)"
          [attr.aria-pressed]="selectedDurations().includes(months)"
          (click)="toggleDuration(months)">
          {{ durationText(months) }}
        </button>
      } @empty {
        <span class="muted small">No durations available.</span>
      }
    </div>
  </section>

  <section class="group">
    <span class="label">Access</span>
    <div class="radio-list">
      @for (choice of accessChoices; track choice.label) {
        <label class="checkbox-row">
          <input type="radio" name="accessScope" [checked]="accessScope() === choice.value"
            (change)="accessScope.set(choice.value)" />
          <span>{{ choice.label }}</span>
        </label>
      }
    </div>
  </section>

  <section class="group">
    <span class="label">Price range</span>

    <div class="price-inputs">
      <div class="field">
        <label class="hint" for="minPrice">Min</label>
        <input id="minPrice" class="input" type="number" min="0" step="1"
          [placeholder]="minBound().toString()" [value]="minPrice() ?? ''"
          (input)="onMinInput($event)" />
      </div>
      <span class="dash">–</span>
      <div class="field">
        <label class="hint" for="maxPrice">Max</label>
        <input id="maxPrice" class="input" type="number" min="0" step="1"
          [placeholder]="maxBound().toString()" [value]="maxPrice() ?? ''"
          (input)="onMaxInput($event)" />
      </div>
    </div>

    <div class="sliders">
      <input type="range" aria-label="Minimum price" [min]="minBound()" [max]="maxBound()" step="1"
        [value]="sliderMin()" (input)="onMinSlider($event)" />
      <input type="range" aria-label="Maximum price" [min]="minBound()" [max]="maxBound()" step="1"
        [value]="sliderMax()" (input)="onMaxSlider($event)" />
      <div class="bounds muted small">
        <span>{{ minBound() }}</span>
        <span>{{ maxBound() }}</span>
      </div>
    </div>
  </section>

  <section class="group">
    <span class="label">Status</span>
    <div class="radio-list inline">
      <label class="checkbox-row">
        <input type="checkbox" [checked]="publishedChecked()"
          (change)="publishedChecked.set(!publishedChecked())" />
        <span>Published</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" [checked]="retiredChecked()"
          (change)="retiredChecked.set(!retiredChecked())" />
        <span>Retired</span>
      </label>
    </div>
  </section>
</div>

<div class="dialog-footer">
  <button type="button" class="btn btn-outline" (click)="clear()">Clear</button>
  <span class="spacer"></span>
  <button type="button" class="btn btn-outline" (click)="cancel()">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="apply()">Apply</button>
</div>
