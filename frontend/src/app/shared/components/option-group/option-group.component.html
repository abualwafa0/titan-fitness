<div class="group" [class.toggle]="variant() === 'toggle'" [class.cards]="variant() === 'radio-card'" role="radiogroup">
  @for (option of options(); track option.value) {
    <span
      class="option-wrap"
      [matTooltip]="option.tooltip ?? ''"
      [matTooltipDisabled]="!option.tooltip"
    >
      <button
        type="button"
        class="option"
        role="radio"
        [class.selected]="value() === option.value"
        [class.disabled]="disabled() || option.disabled"
        [attr.aria-checked]="value() === option.value"
        [attr.aria-disabled]="disabled() || option.disabled ? 'true' : null"
        (click)="select(option)"
      >
        @if (variant() === 'radio-card') {
          <span class="dot" aria-hidden="true"></span>
        }
        <span>{{ option.label }}</span>
      </button>
    </span>
  }
</div>
