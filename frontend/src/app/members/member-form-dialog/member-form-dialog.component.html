<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="dialog-header">
    <h2 class="dialog-title">{{ title }}</h2>
    <button type="button" class="icon-btn" aria-label="Close" (click)="cancel()">
      <app-icon name="close" [size]="18" />
    </button>
  </div>

  <div class="dialog-body" appAutofocus>
    @if (banner().length > 0) {
      <div class="banner banner-error form-banner" role="alert">
        @for (message of banner(); track message) {
          <div>{{ message }}</div>
        }
      </div>
    }

    <div class="stack-lg">
      @if (mode === 'edit') {
        <div class="field">
          <span class="label">Member ID</span>
          <span class="read-only">{{ memberNumber }}</span>
        </div>
      }

      <div class="field">
        <label class="label required" for="fullName">Member name</label>
        <input id="fullName" class="input" type="text" formControlName="fullName"
          placeholder="e.g., John Smith" maxlength="80" autocomplete="off" />
        <app-field-error [control]="form.controls.fullName" label="Member name" />
      </div>

      <div class="field">
        <label class="label required" for="homeBranchId">Branch</label>
        <select id="homeBranchId" class="select" formControlName="homeBranchId">
          <option [ngValue]="null" disabled>Select a branch</option>
          @for (branch of branches(); track branch.branchId) {
            <option [ngValue]="branch.branchId">{{ branch.branchName }}</option>
          }
        </select>
        <app-field-error [control]="form.controls.homeBranchId" label="Branch" />
      </div>

      <div class="field">
        <span class="label">Status</span>
        @if (mode === 'add') {
          <span><app-status-badge status="Active" /></span>
        } @else if (member?.status) {
          <span><app-status-badge [status]="member?.status ?? ''" /></span>
        } @else {
          <span class="read-only">—</span>
        }
      </div>
    </div>
  </div>

  <div class="dialog-footer">
    <button type="button" class="btn btn-outline" [disabled]="saving()" (click)="cancel()">
      Cancel
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ mode === 'add' ? 'Add Member' : 'Save Changes' }}
    </button>
  </div>
</form>
